receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
processors:
  batch:
    send_batch_size: 50
    timeout: 30s
exporters:
  otlp/langfuse:
    endpoint: ${LANGFUSE_OTLP_ENDPOINT}
    sending_queue:
      enabled: true
    tls:
      insecure: true
    headers:
      X-Langfuse-Public-Key: ${LANGFUSE_PUBLIC_KEY}
      X-Langfuse-Secret-Key: ${LANGFUSE_SECRET_KEY}

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/langfuse]